<section
  class="page page--wide"
  aria-labelledby="finance-heading">
  <home-page-header
    title="Finanzen"
    subtitle="Konten, Buchungen, Kategorien und Auswertung im Überblick"
    headingId="finance-heading"></home-page-header>

  @if (store.error()) {
    <div
      class="status-banner status-banner--danger"
      role="alert">
      <i
        class="bi bi-exclamation-triangle-fill"
        aria-hidden="true"></i>
      <span>{{ store.error() }}</span>
    </div>
  }

  <div class="finance-panel">
    <home-tab-bar
      [tabs]="tabs"
      [activeId]="uiStore.activeTab()"
      ariaLabel="Finanzbereiche"
      (activeIdChange)="uiStore.setActiveTab($event)"></home-tab-bar>

    <div class="finance-panel__body">
      @switch (uiStore.activeTab()) {
        @case ('accounts') {
          <home-accounts-view class="tab-panel-enter"></home-accounts-view>
        }
        @case ('transactions') {
          <home-transactions-view class="tab-panel-enter"></home-transactions-view>
        }
        @case ('categories') {
          <home-categories-view class="tab-panel-enter"></home-categories-view>
        }
        @case ('paymentPartners') {
          <home-payment-partners-view class="tab-panel-enter"></home-payment-partners-view>
        }
        @case ('report') {
          <home-report-view class="tab-panel-enter"></home-report-view>
        }
      }
    </div>
  </div>
</section>
