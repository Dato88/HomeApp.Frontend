<section class="page" aria-labelledby="finance-heading">
  <home-page-header title="Finanzen" headingId="finance-heading"></home-page-header>

  @if (store.error()) {
    <div class="status-banner status-banner--danger" role="alert">
      <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
      <span>{{ store.error() }}</span>
    </div>
  }

  <home-tab-bar
    [tabs]="tabs"
    [activeId]="uiStore.activeTab()"
    ariaLabel="Finanzbereiche"
    (activeIdChange)="uiStore.setActiveTab($event)"></home-tab-bar>

  @switch (uiStore.activeTab()) {
    @case ('accounts') {
      <home-accounts-view></home-accounts-view>
    }
    @case ('transactions') {
      <home-transactions-view></home-transactions-view>
    }
    @case ('categories') {
      <home-categories-view></home-categories-view>
    }
  }
</section>
