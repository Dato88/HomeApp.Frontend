<article class="card household-card">
  <header class="household-card__header">
    @if (isRenaming()) {
      <form class="household-card__form" (submit)="submitRename($event)" novalidate>
        <lib-input-field
          label="Haushaltsname"
          effectStyle="box"
          [required]="true"
          [value]="renameValue()"
          (valueChange)="renameValue.set($event)" />
        <lib-button [type]="'submit'" [label]="'Speichern'"></lib-button>
        <lib-button [label]="'Abbrechen'" (clicked)="isRenaming.set(false)"></lib-button>
      </form>
    } @else {
      <h2 class="household-card__title">{{ household().name }}</h2>
      <div class="household-card__actions">
        <lib-button
          [label]="'Umbenennen'"
          [ariaLabel]="'Haushalt ' + household().name + ' umbenennen'"
          (clicked)="startRename()"></lib-button>
        <lib-button
          [label]="'Löschen'"
          [ariaLabel]="'Haushalt ' + household().name + ' löschen'"
          (clicked)="deleteHousehold.emit(household().householdId)"></lib-button>
      </div>
    }
  </header>

  <h3 class="household-card__subtitle">Mitglieder</h3>
  <ul class="member-list" role="list">
    @for (member of household().members; track member.personId) {
      <li class="member-list__item">
        <div class="member-list__identity">
          <span class="member-list__name">{{ member.firstName }} {{ member.lastName }}</span>
          <span class="member-list__email">{{ member.email }}</span>
        </div>
        <button
          type="button"
          class="member-list__remove"
          [disabled]="household().members.length <= 1"
          [attr.aria-label]="member.email + ' aus ' + household().name + ' entfernen'"
          (click)="confirmRemoveMember(member)">
          <i class="bi bi-person-dash" aria-hidden="true"></i>
        </button>
      </li>
    }
  </ul>

  <form class="household-card__form" (submit)="submitInvite($event)" novalidate>
    <lib-input-field
      label="Per E-Mail einladen"
      type="email"
      placeholder="partner@beispiel.de"
      effectStyle="box"
      [value]="inviteForm.email().value()"
      (valueChange)="inviteForm.email().value.set($event)"
      [validationState]="
        inviteForm.email().invalid() && inviteForm.email().touched() ? 'error' : null
      "
      [errorMessage]="
        inviteForm.email().invalid() && inviteForm.email().touched()
          ? 'Bitte eine gültige E-Mail-Adresse eingeben'
          : ''
      "
      [attr.aria-invalid]="inviteForm.email().invalid() && inviteForm.email().touched()" />
    <lib-button [type]="'submit'" [label]="'Einladen'"></lib-button>
  </form>
</article>

<home-confirm-dialog
  #removeMemberDialog
  title="Mitglied entfernen?"
  [message]="removeConfirmMessage()"
  (confirmed)="onRemoveMemberConfirmed($event)"></home-confirm-dialog>
