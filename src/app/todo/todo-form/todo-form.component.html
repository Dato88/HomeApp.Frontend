<div class="todo-form">
  <form
    [formGroup]="todoForm"
    (ngSubmit)="submitForm()">
    <input-field
      [identifier]="'todo-create'"
      [name]="'title'"
      [label]="'New Todo'"
      [placeholder]="'Title'"
      [autofocus]="true"></input-field>
    <home-button
      [type]="'submit'"
      [label]="'Add'"></home-button>
  </form>
</div>
