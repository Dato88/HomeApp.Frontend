<div class="todo-form">
  <form
    [formGroup]="todoForm"
    (ngSubmit)="submitForm()">
    <mat-form-field appearance="outline">
      <mat-label>New Todo</mat-label>
      <input
        type="text"
        matInput
        autofocus
        formControlName="name"
        placeholder="Title" />
    </mat-form-field>
    <button
      mat-flat-button
      type="submit">
      Add
    </button>
  </form>
</div>
