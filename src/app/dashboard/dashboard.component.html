<section
  class="page"
  aria-labelledby="dashboard-heading">
  <home-page-header
    title="Home"
    headingId="dashboard-heading"></home-page-header>

  <nav
    class="dashboard-nav"
    aria-label="Bereiche">
    @for (item of navItems; track item.title) {
      <a
        class="dashboard-nav-card card"
        [routerLink]="item.route"
        [queryParams]="item.queryParams ?? null"
        routerLinkActive="dashboard-nav-card--active"
        ariaCurrentWhenActive="page">
        <i
          class="bi dashboard-nav-card__icon"
          [class]="item.icon"
          aria-hidden="true"></i>
        <span class="dashboard-nav-card__title">{{ item.title }}</span>
        <span class="dashboard-nav-card__description">{{ item.description }}</span>
      </a>
    }
  </nav>
</section>
